
name: Daily Index Update

on:
  workflow_dispatch:
    inputs:
      run_minutes:
        description: 'Test duration in minutes (1-30)'
        type: number
        required: true
        default: 3
  schedule:
    - cron: "12 21 * * *"
    - cron: "42 2 * * *"
    - cron: "12 8 * * *"
    - cron: "42 13 * * *"

permissions:
  contents: write

concurrency:
  group: daily-index-update
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ENABLE_SCHEDULE == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 345

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compute run duration
        id: duration
        shell: bash
        env:
          TRIGGER: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          RUN_MINUTES: ${{ inputs.run_minutes }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          trigger = os.environ.get('TRIGGER')
          now = datetime.now(ZoneInfo('Asia/Seoul'))
          if trigger == 'workflow_dispatch':
              try:
                  minutes = int(os.environ.get('RUN_MINUTES') or '3')
              except ValueError:
                  minutes = 3
              print(f'seconds={min(30, max(1, minutes)) * 60}')
          else:
              next_slots = {
                  '12 21 * * *': (11, 42),
                  '42 2 * * *': (17, 12),
                  '12 8 * * *': (22, 42),
                  '42 13 * * *': (0, 0),
              }
              slot = next_slots.get(os.environ.get('CRON'))
              if slot is None:
                  raise SystemExit('Unknown schedule')
              end = now.replace(
                  hour=slot[0],
                  minute=slot[1],
                  second=0,
                  microsecond=0
              )
              if slot == (0, 0) and now.hour >= 22:
                  end += timedelta(days=1)
              remain = (end - now).total_seconds() - 60
              print(f'seconds={min(330 * 60, max(60, int(remain)))}')
          PY

      - name: Verify configuration
        shell: bash
        env:
          NOTICE_ENDPOINT: ${{ secrets.NOTICE_ENDPOINT }}
          NOTICE_TARGET: ${{ secrets.NOTICE_TARGET }}
        run: |
          if [[ -z "$NOTICE_ENDPOINT" || -z "$NOTICE_TARGET" ]]; then
            echo 'Missing required Actions secrets' >&2
            exit 1
          fi

      - name: Run synchronization
        env:
          RUN_SECONDS: ${{ steps.duration.outputs.seconds }}
          NOTICE_ENDPOINT: ${{ secrets.NOTICE_ENDPOINT }}
          NOTICE_TARGET: ${{ secrets.NOTICE_TARGET }}
        run: python -u sync_worker.py

      - name: Persist state
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- cache_index.json cache_snapshot.json .cache_ready cache_notice.json
          if git diff --cached --quiet; then
            echo 'No state updates'
          else
            git commit -m 'Update index state'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
