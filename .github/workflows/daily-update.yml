
name: Daily Index Update

on:
  workflow_dispatch:

  schedule:
    - cron: "12 21 * * *"
    - cron: "42 2 * * *"
    - cron: "12 8 * * *"
    - cron: "42 13 * * *"

permissions:
  contents: write

concurrency:
  group: daily-index-update
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ENABLE_SCHEDULE == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 345

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compute run duration
        id: duration
        shell: bash
        env:
          TRIGGER: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Asia/Seoul"))
          trigger = os.environ.get("TRIGGER", "")

          slots = {
              "12 21 * * *": (11, 42),
              "42 2 * * *": (17, 12),
              "12 8 * * *": (22, 42),
              "42 13 * * *": (0, 0),
          }

          if trigger == "schedule":
              slot = slots.get(os.environ.get("CRON", ""))
              if slot is None:
                  raise SystemExit("Unknown schedule")

          else:
              current = (now.hour, now.minute)

              if (6, 12) <= current < (11, 42):
                  slot = (11, 42)
              elif (11, 42) <= current < (17, 12):
                  slot = (17, 12)
              elif (17, 12) <= current < (22, 42):
                  slot = (22, 42)
              elif current >= (22, 42):
                  slot = (0, 0)
              else:
                  print("seconds=0")
                  raise SystemExit

          target = now.replace(
              hour=slot[0],
              minute=slot[1],
              second=0,
              microsecond=0
          )

          if slot == (0, 0) and now.hour >= 22:
              target += timedelta(days=1)

          seconds = int((target - now).total_seconds()) - 60
          seconds = max(60, min(19800, seconds))

          print(f"seconds={seconds}")
          PY

      - name: Verify configuration
        shell: bash
        env:
          NOTICE_ENDPOINT: ${{ secrets.NOTICE_ENDPOINT }}
          NOTICE_TARGET: ${{ secrets.NOTICE_TARGET }}
        run: |
          if [[ -z "$NOTICE_ENDPOINT" || -z "$NOTICE_TARGET" ]]; then
            echo 'Missing required Actions secrets' >&2
            exit 1
          fi

      - name: Run synchronization
        env:
          RUN_SECONDS: ${{ steps.duration.outputs.seconds }}
          NOTICE_ENDPOINT: ${{ secrets.NOTICE_ENDPOINT }}
          NOTICE_TARGET: ${{ secrets.NOTICE_TARGET }}
        run: |
          if [[ "$RUN_SECONDS" -eq 0 ]]; then
            echo "Outside scheduled monitoring hours"
            exit 0
          fi
          python -u sync_worker.py

      - name: Persist state
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -- cache_index.json cache_snapshot.json .cache_ready cache_notice.json

          if git diff --cached --quiet; then
            echo 'No state updates'
          else
            git commit -m 'Update index state'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
